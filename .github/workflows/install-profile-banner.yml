name: Install final Star Davos profile banner

on:
  push:
    paths:
      - '.github/workflows/install-profile-banner.yml'

permissions:
  contents: write

jobs:
  install-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify uploaded banner
        shell: bash
        run: |
          mkdir -p assets
          cat .banner_parts/*.b64 | tr -d '\n\r ' | base64 --decode > assets/star-davos-banner.webp
          echo "cda61d5304094b1ce8fb2421656816958404799aa0d72decaf53668e8456589f  assets/star-davos-banner.webp" | sha256sum -c -
          file assets/star-davos-banner.webp
          rm -rf .banner_parts
          rm -f .github/workflows/install-profile-banner.yml

      - name: Commit final banner and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install uploaded Star Davos profile banner"
          git push
